spring:
  application:
    name: stagepass

  # Base relacional "legacy" para recintos y asientos. El driver SQLite no pide servidor:
  # la base vive en un archivo local. Si el equipo decide migrar a MySQL solo cambia el
  # adaptador de persistencia y este url; el dominio y los puertos no se tocan.
  datasource:
    url: jdbc:sqlite:stagepass.db
    driver-class-name: org.sqlite.JDBC

  # Boot ejecuta schema.sql y data.sql en cada arranque; los scripts son idempotentes.
  sql:
    init:
      mode: always

  # Mongo para ordenes de compra y boletos emitidas. En Spring Boot 4 la clave canonica
  # es spring.mongodb.uri; la vieja spring.data.mongodb.uri quedo obsoleta.
  mongodb:
    uri: mongodb://localhost:27017/stagepass

server:
  port: 8080

# Configuracion propia del taller. La clave viaja como variable de entorno en un
# despliegue real; el valor por defecto es solo para la demo local.
stagepass:
  clave-secreta-eventos: ${STAGEPASS_CLAVE_SECRETA:clave-secreta-demo}
  url-base-validacion: ${STAGEPASS_URL_BASE_VALIDACION:http://localhost:8080/api/v1/boletos}
